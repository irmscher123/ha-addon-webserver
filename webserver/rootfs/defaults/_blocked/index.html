<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seite gesperrt</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f5f7; color: #1d2330;
  }
  @media (prefers-color-scheme: dark) { body { background: #14171c; color: #e6e8eb; } .card { background: #1e232b; } }
  .card {
    background: #fff; max-width: 440px; margin: 24px; padding: 36px 32px;
    border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center;
  }
  .icon { font-size: 48px; line-height: 1; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { margin: 8px 0; opacity: .8; line-height: 1.5; }
  code {
    display: inline-block; margin-top: 12px; padding: 6px 12px; border-radius: 8px;
    background: rgba(127,127,127,.15); font-size: 15px; word-break: break-all;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⛔</div>
    <h1>Diese Seite ist gesperrt</h1>
    <p>Der Zugriff wurde vom Netzwerkfilter im Heimnetz blockiert.</p>
    <code id="host"></code>
    <p style="margin-top:20px;font-size:14px">Falls das ein Fehler ist, bitte melden.</p>
  </div>
  <script>document.getElementById('host').textContent = location.hostname || 'unbekannt';</script>
</body>
</html>
