<!DOCTYPE html>
<!-- auto-blockpage: Diese Zeile entfernen, damit die Datei bei Add-on-Updates nicht ersetzt wird -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="10;url=https://www.irmscher.at">
<title>Seite gesperrt</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, #3a0d12 0%, #16080a 70%);
    color: #ffffff;
  }
  .card {
    width: 100%; max-width: 560px; text-align: center;
    background: #ffffff; color: #1a1a1a;
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  .head {
    background: #d7262f; color: #ffffff; padding: 34px 24px 28px;
  }
  .icon {
    width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%;
    background: #ffffff; display: grid; place-items: center;
  }
  .icon span { display: block; width: 46px; height: 12px; border-radius: 3px; background: #d7262f; }
  h1 { margin: 0; font-size: clamp(26px, 5vw, 34px); font-weight: 800; letter-spacing: -.01em; }
  .body { padding: 28px 28px 32px; }
  .lead { margin: 0 0 14px; font-size: 18px; line-height: 1.5; color: #333; }
  .host {
    display: inline-block; max-width: 100%; padding: 8px 16px; border-radius: 10px;
    background: #fdecec; color: #b0141d; border: 2px solid #f5b8bb;
    font: 600 17px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace; word-break: break-all;
  }
  .count { margin: 26px 0 10px; font-size: 17px; color: #333; }
  .count b { font-size: 26px; color: #d7262f; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: #eee; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: #d7262f; transform-origin: left; animation: shrink 10s linear forwards; }
  @keyframes shrink { to { transform: scaleX(0); } }
  .btn {
    display: inline-block; margin-top: 24px; padding: 14px 26px; border-radius: 12px;
    background: #1a1a1a; color: #ffffff; text-decoration: none; font-size: 17px; font-weight: 700;
  }
  .btn:hover, .btn:focus-visible { background: #d7262f; outline: none; }
  .foot { margin: 20px 0 0; font-size: 14px; color: #666; }
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <div class="icon" aria-hidden="true"><span></span></div>
      <h1>Diese Seite ist gesperrt</h1>
    </div>
    <div class="body">
      <p class="lead">Der Zugriff wurde vom Netzwerkfilter im Heimnetz blockiert.</p>
      <div class="host" id="host">gesperrte Seite</div>
      <p class="count">Weiterleitung zu www.irmscher.at in <b id="sec">10</b> Sekunden</p>
      <div class="bar"><i></i></div>
      <a class="btn" href="https://www.irmscher.at">Jetzt zu www.irmscher.at →</a>
      <p class="foot">Falls das ein Fehler ist, bitte melden.</p>
    </div>
  </main>
  <script>
    document.getElementById('host').textContent = location.hostname || 'gesperrte Seite';
    var s = 10, el = document.getElementById('sec');
    var t = setInterval(function () {
      s--; el.textContent = s;
      if (s <= 0) { clearInterval(t); location.href = 'https://www.irmscher.at'; }
    }, 1000);
  </script>
</body>
</html>
