# Hostnamen, unter denen die "echte" Website laufen soll.
# Alles andere (= von AdGuard umgeleitete Domains) bekommt die Sperrseite.
map $host $blocked_host {
    default            1;
    "~^[0-9.]+$"       0;   # Aufruf per IPv4, z. B. http://192.168.1.10
    "~:"               0;   # Aufruf per IPv6
    "~\.local$"        0;   # z. B. homeassistant.local
    homeassistant      0;
    localhost          0;
    # eigene Namen hier ergänzen, z. B.:
    # web.irmscher.at  0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /share/web;
    index index.php index.html;
    client_max_body_size 50m;

    if ($blocked_host) {
        # Zertifikat + Anleitung bleiben auch unter gesperrten Domains erreichbar
        rewrite ^/(?!ca\.crt$|zertifikat\.html$) /_blocked/index.html last;
    }

    location ^~ /_blocked/ {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi.conf;
    }
}
